name: CI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, unit/component tests, parser fixtures
        run: npm run check
      - name: Verify published dataset immutability against base git ref (SEC-M3-101e)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          node scripts/dataset.mjs check --base "$BASE_REF"
      - name: Verify production bundle disables allowUnpublished and emits headers/SW (SEC-M3-003b/d, SEC-M3-007)
        run: npm run verify:bundle

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx -w @ky-nay/web playwright install --with-deps chromium
      - name: End-to-end tests (production build, synthetic dataset)
        run: npm run test:e2e
